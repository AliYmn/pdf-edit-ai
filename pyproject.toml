[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pdf-agent-tools"
version = "0.1.0"
description = "Local-first PDF inspection, editing, reconstruction and comparison toolkit for AI coding agents."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
dependencies = [
    "pymupdf>=2.0",  # bundles pymupdf4llm, used by the --engine pymupdf markdown fallback
    "marker-pdf>=1.6",
    "pillow>=10.1",
    "playwright>=1.45",
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
    "pydantic>=2.6",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pdf-tool = "pdf_tools.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/pdf_tools"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "marker: runs Datalab Marker models (slow, downloads weights on first use)",
]
